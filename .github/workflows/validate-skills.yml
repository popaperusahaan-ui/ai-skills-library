name: Validate Skills

on:
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - ".github/workflows/validate-skills.yml"

  pull_request:
    branches:
      - main
    paths:
      - "skills/**"
      - ".github/workflows/validate-skills.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Skill Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate Skill Files
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          skill_files = list(Path("skills").glob("*/SKILL.md"))

          if not skill_files:
              print("No SKILL.md files found.")
              sys.exit(1)

          required_sections = [
              "## Purpose",
              "## Instructions",
              "## Workflow",
              "## Rules",
              "## Output",
          ]

          errors = []

          for file in skill_files:
              content = file.read_text(encoding="utf-8")

              if not content.startswith("---\n"):
                  errors.append(f"{file}: Missing YAML frontmatter.")
                  continue

              if content.count("---") < 2:
                  errors.append(f"{file}: Incomplete YAML frontmatter.")
                  continue

              frontmatter = content.split("---", 2)[1]

              if "name:" not in frontmatter:
                  errors.append(f"{file}: Missing name metadata.")

              if "description:" not in frontmatter:
                  errors.append(f"{file}: Missing description metadata.")

              for section in required_sections:
                  if section not in content:
                      errors.append(f"{file}: Missing {section} section.")

          if errors:
              print("\n".join(errors))
              sys.exit(1)

          print(f"Successfully validated {len(skill_files)} skill files.")
          PY
